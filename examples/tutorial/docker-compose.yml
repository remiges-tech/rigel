# Docker Compose configuration for Rigel tutorial example
# Uses the same simple etcd setup as other examples
version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: rigel-tutorial-etcd
    command: etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data

volumes:
  etcd-data:
    name: rigel-tutorial-etcd-data